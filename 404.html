    <style>
      :root{
        --bg:#edf0f5; --panel:#ffffff; --panel2:#f4f6fa; --ink:#13233d; --muted:#5b6c85;
        --line:#d8dfe9; --navy:#0a1f3d; --navy2:#0e2a52; --gold:#c08f1d; --gold2:#e8b93e;
        --gold-soft:#fdf3d7; --stage:#0a1a30; --danger:#c0392b; --ok:#1e7d46;
        --shadow:0 6px 24px rgba(10,31,61,.10);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#060f1e; --panel:#0c1e36; --panel2:#10263f; --ink:#edf3fb; --muted:#9db1c9;
          --line:#1d385c; --navy:#081831; --navy2:#0e2a52; --gold:#e8b93e; --gold2:#e8b93e;
          --gold-soft:#2a2110; --stage:#050d1a; --danger:#ff7a6b; --ok:#4cc38a;
          --shadow:0 6px 24px rgba(0,0,0,.4);
        }
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.45}
      h1,h2,h3,.disp{font-family:"Sora",sans-serif}
      button{font-family:inherit;cursor:pointer}
      input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
      :focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

      /* ---------- Header ---------- */
      header.top{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
      .brand{display:flex;align-items:center;gap:10px;min-width:0}
      .brand img{width:38px;height:38px;flex:none;border-radius:9px;object-fit:cover}
      .brand .bname{font-family:"Sora",sans-serif;font-weight:800;font-size:20px;letter-spacing:.2px;white-space:nowrap;margin:0}
      .brand .bname em{font-style:normal;color:var(--gold2)}
      .brand .bsub{font-size:11px;color:#b9cbe4;letter-spacing:.4px}
      .hdr-spacer{flex:1}
      #projectName{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 10px;min-width:130px;max-width:220px;font-weight:600}
      #projectName::placeholder{color:#9db1c9}
      .hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
      .hbtn:hover{background:rgba(255,255,255,.2)}
      .hbtn.gold{background:var(--gold2);border-color:var(--gold2);color:#221a02}
      .hbtn.gold:hover{background:#f3cd60}
      .hbtn:disabled{opacity:.5;cursor:wait}
      #projectSelect{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13px;max-width:150px}
      #projectSelect option{color:#13233d}
      #formatNote{font-size:11.5px;color:#b9cbe4;width:100%;text-align:right}

      /* ---------- Layout ---------- */
      .layout{display:grid;gap:12px;padding:12px;grid-template-columns:292px minmax(0,1fr) 302px;grid-template-areas:"tools stage assist" "tools timeline timeline";align-items:start;max-width:1720px;margin:0 auto}
      .tools{grid-area:tools}.stagecol{grid-area:stage}.assistcol{grid-area:assist}.tlcol{grid-area:timeline}
      @media (max-width:1180px){
        .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "assist" "timeline" "tools"}
      }
      .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
      .card .chead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
      .card .chead h2{font-size:14px;margin:0;letter-spacing:.3px}
      .card .cbody{padding:12px 14px}

      /* ---------- Stage ---------- */
      .stagewrap{background:var(--stage);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line)}
      #stage{max-width:100%;height:auto;border-radius:8px;background:#000;box-shadow:0 10px 34px rgba(0,0,0,.45);touch-action:none}
      .presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
      .preset{border:1px solid #33507c;background:#0d2447;color:#cfe0f5;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px}
      .preset.on{background:var(--gold2);color:#221a02;border-color:var(--gold2)}
      .transport{display:flex;align-items:center;gap:10px;width:100%;max-width:640px}
      .tbtn{width:46px;height:46px;border-radius:50%;border:none;background:var(--gold2);color:#221a02;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
      .tbtn.small{width:38px;height:38px;background:#16345e;color:#dbe8fa;font-size:14px}
      #seek{flex:1;accent-color:var(--gold2);height:28px}
      #timeLabel{color:#dbe8fa;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;font-weight:600}
      .stagehint{color:#8fa8c8;font-size:12.5px;text-align:center}
      #exportBox{width:100%;max-width:640px;display:none;background:#0d2447;border:1px solid #33507c;border-radius:10px;padding:10px 12px;color:#dbe8fa}
      #exportBox .bar{height:10px;background:#081831;border-radius:99px;overflow:hidden;margin-top:8px}
      #exportBar{height:100%;width:0%;background:var(--gold2);transition:width .2s}
      #downloadLink{display:none;margin-top:10px;background:var(--gold2);color:#221a02;font-weight:800;border-radius:8px;padding:10px 14px;text-decoration:none;text-align:center}

      /* ---------- Tools / tabs ---------- */
      .tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0}
      .tab{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:700;font-size:12.5px}
      .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
      @media (prefers-color-scheme: dark){.tab.on{background:var(--gold2);color:#221a02;border-color:var(--gold2)}}
      .pane{display:none;padding:12px 14px 16px}
      .pane.on{display:block}
      .pane h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 8px}
      .pane h3:first-child{margin-top:2px}
      .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .row + .row{margin-top:8px}
      .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px}
      .btn:hover{border-color:var(--gold)}
      .btn.gold{background:var(--gold2);border-color:var(--gold2);color:#221a02}
      .btn.danger{color:var(--danger)}
      .btn.small{padding:6px 9px;font-size:12px}
      .btn.block{width:100%;text-align:center}
      label.flabel{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin:10px 0 4px}
      input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
      textarea{resize:vertical;min-height:74px}
      input[type=range]{width:100%;accent-color:var(--gold)}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .mini{font-size:12px;color:var(--muted)}
      .val{font-weight:800;color:var(--ink)}
      .toggle{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;color:var(--muted)}
      .toggle.on{background:var(--ok);border-color:var(--ok);color:#fff}
      .fname{font-size:12.5px;font-weight:700;word-break:break-all}
      .listitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-top:6px;background:var(--panel2)}
      .listitem.sel{border-color:var(--gold);background:var(--gold-soft)}
      .listitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
      .swatches{display:flex;gap:6px}
      .swatch{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);padding:0}
      .swatch.on{border-color:var(--gold)}

      /* ---------- Timeline ---------- */
      .tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .tl-head h2{font-size:14px;margin:0}
      #tlTrack{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 8px;min-height:104px;align-items:stretch}
      .clipblk{flex:none;width:118px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);padding:6px;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-x}
      .clipblk.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
      .clipblk.dragging{opacity:.45}
      .clipblk img{width:100%;height:56px;object-fit:cover;border-radius:6px;background:#0a1a30;display:block}
      .clipblk .cn{font-size:11.5px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .clipblk .cd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
      .clipblk .badge{position:absolute;top:9px;left:9px;background:rgba(6,15,30,.78);color:#ffd968;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;letter-spacing:.4px}
      .tl-empty{color:var(--muted);font-size:13.5px;padding:22px 8px}

      /* ---------- Assistant ---------- */
      .assist .chead{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-radius:13px 13px 0 0;border-bottom:none}
      .assist .chead h2{color:#fff}
      .assist .chead .mini{color:#b9cbe4}
      #chatLog{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px}
      .msg{border-radius:11px;padding:8px 11px;font-size:13.5px;max-width:94%}
      .msg.bot{background:var(--panel2);border:1px solid var(--line);align-self:flex-start}
      .msg.me{background:var(--navy);color:#fff;align-self:flex-end}
      @media (prefers-color-scheme: dark){.msg.me{background:var(--gold2);color:#221a02}}
      .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
      .chip{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
      .chip:hover{background:var(--gold-soft)}
      .chatin{display:flex;gap:6px;padding:0 14px 14px}
      .chatin input{flex:1}
      .chatin button{background:var(--gold2);border:none;color:#221a02;font-weight:800;border-radius:8px;padding:0 14px}

      footer.site{padding:18px 14px 26px;text-align:center;color:var(--muted);font-size:13px}
      footer.site b{color:var(--ink)}
      .hidden{display:none !important}
      @media (max-width:560px){
        .brand .bsub{display:none}
        #projectName{max-width:130px}
        .clipblk{width:102px}
        .tbtn{width:44px;height:44px}
      }
